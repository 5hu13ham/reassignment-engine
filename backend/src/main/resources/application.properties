spring.application.name=ai-reassignment-engine
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:reassignment;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
routing.strategy=${ROUTING_STRATEGY:rule}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:gemini-flash-latest}
llm.base-url=${LLM_BASE_URL:https://generativelanguage.googleapis.com}
llm.timeout-ms=${LLM_TIMEOUT_MS:10000}
management.endpoints.web.exposure.include=health,info
