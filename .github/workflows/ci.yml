name: Reassignment Engine CI
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile and run backend tests
        run: mvn -B -ntp -f backend/pom.xml clean verify
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build local demonstration stack
        run: docker compose up --build -d
      - name: Validate API, UI and automatic approval flow
        run: python3 scripts/smoke_demo.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop containers
        if: always()
        run: docker compose down -v
