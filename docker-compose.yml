services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-rule}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-flash-latest}
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
